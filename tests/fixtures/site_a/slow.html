<!doctype html><html><head><title>Slow page</title></head>
<body>
<h1>Loading the notice</h1>
<p id="status">Please wait...</p>
<script>
setTimeout(function(){
  document.getElementById('status').textContent = 'Notice: the warehouse closes at 8 pm on Friday.';
  var b = document.createElement('button'); b.textContent = 'Acknowledge'; document.body.appendChild(b);
}, 12000);
</script>
</body></html>
